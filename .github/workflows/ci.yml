# CI gate (OverSeer, see ~/Homelab/OverSeer/CLAUDE.md §6). No secrets, no homelab access:
# Postgres is a throwaway service container. Deploys stay local (OverSeer bin/deploy).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17-bookworm
        env:
          POSTGRES_PASSWORD: ci-superuser-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      HOMELAB_TEST_DATABASE_URL: postgresql://homelab_test:ci-only-not-a-secret@127.0.0.1:5432/homelab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Test database (mirrors Database-Manager initdb/01-extensions.sql + homelab_test role)
        env:
          PGPASSWORD: ci-superuser-not-a-secret
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres <<'SQL'
          CREATE ROLE homelab_test LOGIN PASSWORD 'ci-only-not-a-secret' NOCREATEROLE NOCREATEDB;
          CREATE DATABASE homelab_test OWNER homelab_test;
          SQL
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d homelab_test <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS unaccent;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE OR REPLACE FUNCTION public.f_unaccent(text) RETURNS text
            LANGUAGE sql IMMUTABLE PARALLEL SAFE STRICT
            RETURN public.unaccent('public.unaccent'::regdictionary, $1);
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          SQL
      - run: pip install -e '.[dev]'
      - name: Gate (pytest)
        run: pytest -q
