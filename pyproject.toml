[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reelscribe"
version = "0.1.0"
description = "Register video links, then download and transcribe them locally with Whisper."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp",
    "faster-whisper",
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
reelscribe = "reelscribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reelscribe = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
